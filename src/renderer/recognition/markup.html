<header class="media-header"><span id="brand"></span><strong>识别与翻译</strong><span id="source-name"></span></header>
<main class="ocr-workbench">
  <div class="ocr-commandbar" role="toolbar" aria-label="识别与翻译操作">
    <div id="ocr-tools" class="ocr-tool-group"><label>语言<select id="language"><option value="chi_sim+eng">中文与英文</option><option value="eng">英文</option></select></label><button id="run" class="primary" disabled>识别文字</button></div>
    <div class="ocr-tool-group"><button id="local-model-configure" class="quiet">OCR 模型</button><button id="open-formula" class="quiet">公式识别 ↗</button></div>
    <div id="ocr-image-tools" class="image-header-tools"></div><button id="workflow-back" class="quiet" hidden>返回截图</button>
    <button id="result-panel-toggle" class="quiet ocr-panel-toggle" aria-label="收起结果栏" aria-controls="ocr-results" aria-expanded="true" title="收起结果栏"></button>
  </div>
  <div class="ocr-workspace" id="ocr-workspace">
    <section class="source-preview" aria-label="识别图片"><img id="source" alt="待识别图片"><div id="image-loading" class="image-loading" role="status" aria-live="polite" hidden><div class="image-loading-card"><span class="recognition-spinner" aria-hidden="true"></span><span id="image-loading-label">识别中</span><button id="overlay-cancel" class="quiet">取消</button></div></div></section>
    <div id="ocr-divider" class="ocr-divider" role="separator" tabindex="0" aria-label="调整图片与结果栏宽度" aria-orientation="vertical" aria-valuemin="30" aria-valuemax="80" aria-valuenow="67"></div>
    <aside id="ocr-results" class="ocr-results" aria-label="识别与翻译结果">
      <section id="text-result" class="ocr-result-section"><div class="ocr-result-heading"><label id="result-label" for="result">识别原文</label></div><textarea id="result" dir="auto" spellcheck="false" placeholder="识别文字或粘贴原文"></textarea></section>
      <section id="translation-result" class="ocr-result-section"><div class="ocr-result-heading"><label for="translated">译文</label><span id="translation-source-note"></span></div>
        <div id="translation-tools" class="ocr-translation-tools"><label>译为<select id="translation-language"></select></label><button id="translate" class="quiet" disabled>翻译全文</button><button id="translation-cancel" class="quiet" hidden>取消翻译</button><button id="translation-configure" class="quiet" aria-label="翻译服务" title="翻译服务">服务</button></div>
        <p id="translation-destination" hidden></p><textarea id="translated" dir="auto" spellcheck="false" placeholder="译文"></textarea></section>
    </aside>
  </div>
  <footer class="ocr-footer"><span id="message" role="status" aria-live="polite" hidden></span><div class="result-actions"><button id="copy" class="quiet" disabled>复制原文</button><button id="translation-copy" class="primary" disabled>复制译文</button></div></footer>
</main>
<dialog id="translation-settings" class="one-dialog one-form-dialog" aria-labelledby="modal-title"></dialog>
