<canvas id="picture" aria-label="拖动摄像头画面移动位置"></canvas>
    <div id="actions">
      <button id="mirror" aria-label="镜像摄像头" title="镜像摄像头"></button
      ><button id="shape" aria-label="切换画面形状" title="切换画面形状"></button
      ><button
        id="hide"
        aria-label="隐藏画中画，继续录制摄像头"
        title="隐藏画中画，继续录制摄像头"
      ></button>
    </div>
    <button id="resize" aria-label="拖动调整摄像头大小" title="拖动调整大小"></button>
    <p id="message" role="status"></p>
