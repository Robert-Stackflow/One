<div id="scroll-region" aria-label="长截图区域"><span>滚动页面截取更多内容</span></div>
<section id="scroll-controls" class="capture-panel" data-tooltip-avoid="scroll-region" aria-label="长截图操作">
  <span id="dimensions" class="scroll-visually-hidden"></span>
  <div class="scroll-actions scroll-toolbar capture-main-row" aria-label="采集操作">
    <button id="sample" type="button" hidden>采集当前帧</button>
    <div class="scroll-modes capture-tool-row" role="group" aria-label="采集模式"><button id="manual" type="button" class="quiet" title="手动滚动">手动</button><button id="auto" type="button" class="quiet" title="自动滚动">自动</button></div>
    <button id="pause" type="button" class="quiet scroll-icon" title="暂停采集" aria-label="暂停采集" hidden></button>
    <button id="undo" type="button" class="quiet scroll-icon" title="撤销拼接" aria-label="撤销拼接" disabled></button>
    <button id="preview-toggle" type="button" class="quiet scroll-icon" title="收起预览" aria-label="收起预览"></button>
    <button id="setup-toggle" type="button" class="quiet scroll-icon" title="采集设置" aria-label="采集设置" aria-expanded="false" aria-controls="setup"></button>
    <span class="scroll-divider capture-divider" role="separator"></span>
    <button id="finish" type="button" hidden disabled>确认已有结果</button>
    <button id="edit" type="button" class="quiet scroll-icon" title="编辑长截图" aria-label="编辑长截图" disabled></button>
    <button id="save" type="button" class="quiet scroll-icon" title="保存长截图" aria-label="保存长截图" disabled></button>
    <button id="cancel" type="button" class="quiet scroll-icon" title="取消长截图 · Esc" aria-label="取消长截图"></button>
    <button id="copy" type="button" class="primary scroll-icon" title="复制并完成" aria-label="复制并完成" disabled></button>
  </div>
  <p id="message" class="scroll-visually-hidden" role="status" aria-live="polite"></p>
</section>
      <details id="setup" data-tooltip-avoid="scroll-region" class="scroll-settings scroll-floating-panel"><summary>采集设置</summary>
        <label><input id="auto-fixed" type="checkbox" checked />自动检测固定栏并保留一次</label>
        <p id="fixed-note" class="help" hidden></p>
        <details>
          <summary>手动修正固定栏</summary>
          <div class="field-pair"><label>开头保留一次<input id="retain-start" type="number" value="0" min="0" step="1" /></label><label>末尾保留一次<input id="retain-end" type="number" value="0" min="0" step="1" /></label></div>
          <button id="copy-fixed" type="button" class="quiet" hidden>采用检测值</button>
        </details>
        <label
          >滚动方向<select id="axis">
            <option value="vertical">向下</option>
            <option value="horizontal">向右</option>
          </select></label
        >
        <div class="field-pair">
          <label
            >排除开头区域<input id="trim-start" type="number" value="0" min="0" step="1" /></label
          ><label
            >排除末尾区域<input id="trim-end" type="number" value="0" min="0" step="1"
          /></label>
        </div>
        <details>
          <summary>匹配区域</summary>
          <p class="help">
            只影响匹配，完整宽度仍保留。可避开侧栏或滚动条；横向模式对应上、下边缘。
          </p>
          <div class="field-pair">
            <label
              >忽略左侧 / 上侧<input
                id="ignore-start"
                type="number"
                value="0"
                min="0"
                step="1" /></label
            ><label
              >忽略右侧 / 下侧<input id="ignore-end" type="number" value="0" min="0" step="1"
            /></label>
          </div>
        </details>
        <button id="apply-settings" type="button" class="quiet">应用并重新开始</button>
      </details>
    <aside class="scroll-preview" data-scroll-interactive aria-label="长截图预览">
      <div id="preview-paper" hidden><img id="preview" alt="拼接结果预览" hidden /><span id="preview-viewport" aria-label="最后采集视口"></span><span id="preview-addition" aria-label="本次新增区域" hidden></span><span id="preview-fixed-start" aria-label="固定开头" hidden></span><span id="preview-fixed-end" aria-label="固定末尾" hidden></span></div>
      <p id="empty" class="help">等待首帧</p>
    </aside>
    <div id="scroll-inspection" class="scroll-inspection" hidden aria-label="预览区域放大"><img id="inspection-image" alt="预览局部内容" /></div>
